# ============================================================================
# AI MED — docker-compose (Этап 1, каркас).
#
# Топология соответствует docs/02_system_architecture.md §7:
#   frontend (:5173) → gateway (Go, :8080) → rag (Python, :8000) → qdrant (:6333)
#   gateway → postgres (:5432)
#   gateway → X5 CoPilot LLM (внешний выход)
#
# Сервис `embeddings` (docs/02 §7) на каркасе НЕ выделен в отдельный контейнер:
# по архитектуре он «может быть частью rag» — локальная модель e5 поднимется
# внутри rag на Этапе 2 (docs/03 §3). При необходимости легко вынести позже.
#
# Запуск: cp .env.example .env && docker compose up --build
# ============================================================================

name: ai-med

services:
  # ─── PostgreSQL (без ПДн, docs/05) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aimed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimed_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aimed}
    ports:
      # ВНЕШНИЙ (хост) порт ⇒ внутренний. Дефолт 5433, чтобы не конфликтовать
      # с локальным PostgreSQL на 5432 (см. .env.example).
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init-скрипты выполняются один раз при пустом томе (схема + seed).
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimed} -d ${POSTGRES_DB:-aimed}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aimed-net

  # ─── Qdrant (векторная БД, docs/03) ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aimed-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"       # REST/Dashboard
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aimed-net

  # ─── RAG-сервис (Python / FastAPI) ──────────────────────────────────────
  rag:
    build:
      context: ./services/rag
      dockerfile: Dockerfile
    container_name: aimed-rag
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-corpus_diaries}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      # Анонимайзер-гейт: ingestion вызывает Go gateway ДО эмбеддинга (docs/04 §1).
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      # Корпус монтируется volume'ом read-only (см. volumes ниже), docs/03 §5.
      CORPUS_DIR: ${CORPUS_DIR:-/data/corpus}
      # Охват ingestion дневников (Этап 4.1): all=весь корпус-дневники | subdir=подпапка.
      CORPUS_DIARIES_SCOPE: ${CORPUS_DIARIES_SCOPE:-all}
      CORPUS_DIARIES_SUBDIR: ${CORPUS_DIARIES_SUBDIR:-02_корпус/сборник_дневников_ИБ}
      CORPUS_DIARY_NAME_RE: ${CORPUS_DIARY_NAME_RE:-дневник}
      CORPUS_DIARY_DIRS: ${CORPUS_DIARY_DIRS:-сборник_дневников_ИБ,заготовки_дневников}
      CORPUS_EXCLUDE_NAME_RE: ${CORPUS_EXCLUDE_NAME_RE:-первичк|первичн|эпикриз|выписк|лист[ _]*назнач|назначени|статкарт|статистическ}
      # Чанкинг (docs/03 §4).
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1200}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
      RAG_PORT: "8000"
      # LLM X5 CoPilot — генерация дневников (Этап 4, docs/03 §9–10).
      # Клиент с автофолбэком моделей живёт в RAG-сервисе. Ключ только из ENV.
      X5_BASE_URL: ${X5_BASE_URL:-https://api-copilot.x5.ru/aigw/v1/}
      X5_API_KEY: ${X5_API_KEY:-}
      LLM_CA_BUNDLE: ${LLM_CA_BUNDLE:-/app/certs/x5_root_ca.pem}
      LLM_MODEL_LARGE: ${LLM_MODEL_LARGE:-x5-airun-large}
      LLM_MODEL_MEDIUM: ${LLM_MODEL_MEDIUM:-x5-airun-medium}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-x5-airun-small}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
    ports:
      - "${RAG_HOST_PORT:-8001}:8000"
    volumes:
      # Корпус мед.документов — ТОЛЬКО чтение (:ro). НЕ копируется в образ,
      # НЕ коммитится в git (.gitignore: Документы/). docs/03 §5.
      - ./Документы:/data/corpus:ro
      # Кэш HF-моделей e5 — чтобы не качать модель при каждом запуске ingestion.
      - rag_hf_cache:/app/.cache/huggingface
      # Корпоративный CA-bundle X5 для реальной генерации (docs/03 §9.2).
      # Положите PEM в ./deploy/certs/ (вне git) и раскомментируйте строку ниже:
      - ./deploy/certs/x5_root_ca.pem:/app/certs/x5_root_ca.pem:ro
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - aimed-net

  # ─── API-Gateway (Go: API · анонимизация · экспорт) ─────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: aimed-gateway
    restart: unless-stopped
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-aimed}:${POSTGRES_PASSWORD:-aimed_dev_password}@postgres:5432/${POSTGRES_DB:-aimed}?sslmode=disable"
      QDRANT_URL: http://qdrant:6333
      # RAG-оркестрация (Этап 5): URL RAG-сервиса + щедрый таймаут на генерацию.
      RAG_URL: http://rag:8000
      RAG_GENERATE_TIMEOUT_S: ${RAG_GENERATE_TIMEOUT_S:-120}
      RAG_HEALTH_TIMEOUT_S: ${RAG_HEALTH_TIMEOUT_S:-5}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5174}
      # LLM (X5 CoPilot) — docs/03 §9. На каркасе вызовы не выполняются.
      X5_BASE_URL: ${X5_BASE_URL:-https://api-copilot.x5.ru/aigw/v1/}
      X5_API_KEY: ${X5_API_KEY:-}
      LLM_CA_BUNDLE: ${LLM_CA_BUNDLE:-/app/certs/x5_root_ca.pem}
      LLM_MODEL_LARGE: ${LLM_MODEL_LARGE:-x5-airun-large}
      LLM_MODEL_MEDIUM: ${LLM_MODEL_MEDIUM:-x5-airun-medium}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-x5-airun-small}
    ports:
      - "${GATEWAY_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started
    # Корпоративный CA-bundle монтируется сюда (docs/03 §9.2). Файл — вне git.
    # Раскомментировать, когда появится сертификат:
    # volumes:
    #   - ./deploy/certs/x5_root_ca.pem:/app/certs/x5_root_ca.pem:ro
    networks:
      - aimed-net

  # ─── Frontend (React 19 + Vite) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aimed-frontend
    restart: unless-stopped
    environment:
      VITE_GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - aimed-net

volumes:
  postgres_data:
  qdrant_data:
  rag_hf_cache:   # кэш локальной модели эмбеддингов e5 (docs/03 §3)

networks:
  aimed-net:
    driver: bridge

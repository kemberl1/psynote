# PsyNote frontend — production nginx.
# Static SPA + reverse-proxy /api → gateway (same pattern as vite.config.ts proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated diaries / exports can be slow (LLM + DOCX).
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # Optional health passthrough for uptime checks.
    location = /health {
        proxy_pass http://gateway:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # index.html и version.json всегда перепроверяются: иначе браузер держит
    # старую сборку и собирает брифы дневников по старым правилам.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # Бандлы с хешем в имени не меняются — кешируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
